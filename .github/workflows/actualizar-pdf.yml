name: Actualizar catálogo PDF

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos
  workflow_dispatch: {}       # permite correrlo manual desde GitHub

permissions:
  contents: write

jobs:
  actualizar-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Generar PDF
        run: python generar_pdf.py

      - name: Subir PDF actualizado al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogo.pdf
          git diff --staged --quiet && echo "Sin cambios, no se hace commit" || git commit -m "Actualizar catalogo PDF [skip ci]"
          git push
